<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Sistem Mahasiswa</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(
                135deg,
                #0d6efd,
                #6ea8fe
            );

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{

            width:100%;
            max-width:450px;

            border:none;
            border-radius:20px;

            box-shadow:
            0 10px 30px rgba(
                0,0,0,0.2
            );

            background:white;

            padding:40px;
        }

        .logo{
            font-size:60px;
        }

        .title{
            font-weight:bold;
            color:#0d6efd;
        }

        .subtitle{
            color:gray;
            margin-bottom:30px;
        }

        .btn-login{
            width:100%;
            padding:10px;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="login-card">

        <div class="text-center">

            <div class="logo">
                🎓
            </div>

            <h2 class="title">
                Sistem Mahasiswa
            </h2>

            <p class="subtitle">
            </p>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="Masukkan Email">

        </div>

        <div class="mb-4">

            <label class="form-label">
                Password
            </label>

            <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Masukkan Password">

        </div>

        <button
            class="btn btn-primary btn-login"
            onclick="login()">

            Login

        </button>

        <div class="text-center mt-4">

            <small class="text-muted">
                Sistem Informasi Data Mahasiswa
            </small>

        </div>

    </div>

<script>

async function login(){

    const response =
    await fetch(
        "http://127.0.0.1:8000/login",
        {
            method:"POST",

            headers:{
                "Content-Type":
                "application/json"
            },

            body:JSON.stringify({
                email:
                document.getElementById(
                    "email"
                ).value,

                password:
                document.getElementById(
                    "password"
                ).value
            })
        }
    );

    const data =
    await response.json();

    if(data.access_token){

        localStorage.setItem(
            "token",
            data.access_token
        );

        alert(
            "Login Berhasil"
        );

        window.location.href =
        "mahasiswa.html";

    }else{

        alert(
            "Login Gagal"
        );

    }
}

</script>

</body>
</html>
