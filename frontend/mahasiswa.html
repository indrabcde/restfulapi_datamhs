<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistem Data Mahasiswa</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background: linear-gradient(
        135deg,
        #0d6efd,
        #6ea8fe
    );

    min-height:100vh;
}

.main-card{
    background:white;

    border-radius:25px;

    box-shadow:
    0 15px 40px rgba(
        0,0,0,0.15
    );

    padding:40px;

    margin-top:50px;
}

.logo{
    font-size:70px;
}

.title{
    color:#0d6efd;
    font-weight:bold;
}

.subtitle{
    color:#6c757d;
}

.table{
    margin-top:20px;
}

.table thead{
    background:#0d6efd;
    color:white;
}

.table thead th{
    border:none;
}

.table tbody tr:hover{
    background:#f5f9ff;
}

.btn{
    border-radius:12px;
}

.modal-content{
    border-radius:20px;
    border:none;
}

</style>

</head>

<body>

<div class="container">
    

    <div class="main-card">
<div class="d-flex justify-content-end mt-4 mb-3">

    <button
        class="btn btn-danger rounded-square shadow-sm"
        onclick="logout()"
        title="Logout">

        <i class="bi bi-box-arrow-right">Logout</i>

    </button>

</div>
        <div class="text-center mb-5">

            <div class="logo">
                🎓
            </div>

            <h1 class="title">
                Sistem Data Mahasiswa
            </h1>

            <p class="subtitle">
            </p>

        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <button
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#tambahModal">

            <i class="bi bi-plus-circle">Tambah Mahasiswa</i>

        </button>

    </div>

    <div>

        <button
            class="btn btn-success"
            onclick="loadData()">

            <i class="bi bi-arrow-clockwise">Refresh</i>

        </button>

    </div>

</div>

        <div class="table-responsive">

            <table class="table table-hover align-middle">

                <thead>

                    <tr>
                        <!-- <th>ID</th> -->
                        <th>Nama</th>
                        <th>NIM</th>
                        <th>Jurusan</th>
                        <th width="220">
                            Aksi
                        </th>
                    </tr>

                </thead>

                <tbody id="tabelMahasiswa">

                </tbody>

            </table>

        </div>

    </div>

</div>

<!-- MODAL TAMBAH -->

<div class="modal fade" id="tambahModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Tambah Mahasiswa
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <div class="mb-3">
                    <label>Nama</label>

                    <input
                        type="text"
                        id="nama"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label>NIM</label>

                    <input
                        type="text"
                        id="nim"
                        class="form-control">
                </div>

                <div class="mb-3">
                    <label>Jurusan</label>

                    <input
                        type="text"
                        id="jurusan"
                        class="form-control">
                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Batal

                </button>

                <button
                    class="btn btn-primary"
                    onclick="tambah()">

                    Simpan

                </button>

            </div>

        </div>

    </div>

</div>

<!-- MODAL EDIT -->

<div class="modal fade" id="editModal">

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Edit Mahasiswa
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                <input
                    type="hidden"
                    id="editId">

                <div class="mb-3">

                    <label>Nama</label>

                    <input
                        type="text"
                        id="editNama"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>NIM</label>

                    <input
                        type="text"
                        id="editNim"
                        class="form-control">

                </div>

                <div class="mb-3">

                    <label>Jurusan</label>

                    <input
                        type="text"
                        id="editJurusan"
                        class="form-control">

                </div>

            </div>

            <div class="modal-footer">

                <button
                    class="btn btn-secondary"
                    data-bs-dismiss="modal">

                    Batal

                </button>

                <button
                    class="btn btn-primary"
                    onclick="updateData()">

                    Simpan Perubahan

                </button>

            </div>

        </div>

    </div>

</div>

<script>

async function loadData(){

    const token =
    localStorage.getItem("token");

    const response =
    await fetch(
        "http://127.0.0.1:8000/mahasiswa",
        {
            headers:{
                "Authorization":
                "Bearer " + token
            }
        }
    );

    const data =
    await response.json();

    let html = "";

    data.forEach(mhs => {

        html += `
        <tr>

            <td>${mhs.nama}</td>
            <td>${mhs.nim}</td>
            <td>${mhs.jurusan}</td>

            <td>

                <button
                class="btn btn-warning btn-sm me-2"
                onclick="editData(
                    '${mhs.id}',
                    '${mhs.nama}',
                    '${mhs.nim}',
                    '${mhs.jurusan}'
                )">

<i class="bi bi-pencil-square">Edit</i>
                </button>

                <button
                class="btn btn-danger btn-sm"
                onclick="hapusData('${mhs.id}')">

<i class="bi bi-trash">Hapus</i>
                </button>

            </td>

        </tr>
        `;
    });

    document.getElementById(
        "tabelMahasiswa"
    ).innerHTML = html;
}

async function tambah(){

    const token =
    localStorage.getItem("token");

    await fetch(
        "http://127.0.0.1:8000/mahasiswa",
        {
            method:"POST",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + token
            },

            body:JSON.stringify({
                nama:document.getElementById("nama").value,
                nim:document.getElementById("nim").value,
                jurusan:document.getElementById("jurusan").value
            })
        }
    );

    bootstrap.Modal
    .getInstance(
        document.getElementById("tambahModal")
    )
    .hide();

    loadData();
}

function editData(
    id,
    nama,
    nim,
    jurusan
){

    document.getElementById(
        "editId"
    ).value=id;

    document.getElementById(
        "editNama"
    ).value=nama;

    document.getElementById(
        "editNim"
    ).value=nim;

    document.getElementById(
        "editJurusan"
    ).value=jurusan;

    new bootstrap.Modal(
        document.getElementById("editModal")
    ).show();
}

async function updateData(){

    const token =
    localStorage.getItem("token");

    const id =
    document.getElementById(
        "editId"
    ).value;

    await fetch(
        `http://127.0.0.1:8000/mahasiswa/${id}`,
        {
            method:"PUT",

            headers:{
                "Content-Type":"application/json",
                "Authorization":"Bearer " + token
            },

            body:JSON.stringify({
                nama:document.getElementById("editNama").value,
                nim:document.getElementById("editNim").value,
                jurusan:document.getElementById("editJurusan").value
            })
        }
    );

    bootstrap.Modal
    .getInstance(
        document.getElementById("editModal")
    )
    .hide();

    loadData();
}

async function hapusData(id){

    if(!confirm(
        "Yakin ingin menghapus data?"
    )){
        return;
    }

    const token =
    localStorage.getItem("token");

    await fetch(
        `http://127.0.0.1:8000/mahasiswa/${id}`,
        {
            method:"DELETE",

            headers:{
                "Authorization":
                "Bearer " + token
            }
        }
    );

    loadData();
}

function logout(){

    const konfirmasi = confirm(
        "Apakah Anda yakin ingin logout?"
    );

    if(!konfirmasi){
        return;
    }

    localStorage.removeItem(
        "token"
    );

    window.location.href =
    "login.html";
}

loadData();

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
