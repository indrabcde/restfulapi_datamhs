<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Mahasiswa | Sistem Informasi Mahasiswa</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icon -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <!-- CSS -->
  <link rel="stylesheet" href="css/mahasiswa_edit.css">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="dashboard.html">
      <i class="bi bi-mortarboard-fill"></i> Sistem Informasi Mahasiswa
    </a>
    <div class="d-flex align-items-center">
      <button class="btn btn-light btn-sm me-2" onclick="kembali()">
        <i class="bi bi-arrow-left"></i> Kembali
      </button>
      <button class="btn btn-danger btn-sm" onclick="logout()">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </div>
</nav>

<!-- HERO -->
<section class="hero">
  <div class="container">
    <div class="hero-content text-center">
      <h2><i class="bi bi-pencil-square"></i> Edit Mahasiswa</h2>
      <p>Ubah data mahasiswa sesuai kebutuhan, lalu simpan.</p>
    </div>
  </div>
</section>

<!-- FORM CARD -->
<div class="container mt-4">
  <div class="card shadow detail-card">
    <div class="card-header">
      <h4><i class="bi bi-person-lines-fill"></i> Formulir Edit Mahasiswa</h4>
    </div>
    <div class="card-body">
      <form id="formMahasiswa">
        <div class="row g-4">
          <div class="col-md-6">
            <label>NIM</label>
            <input type="text" class="form-control" id="nim" required>
          </div>
          <div class="col-md-6">
            <label>Nama Lengkap</label>
            <input type="text" class="form-control" id="nama" required>
          </div>
          <div class="col-md-6">
            <label>Email</label>
            <input type="email" class="form-control" id="email">
          </div>
          <div class="col-md-6">
            <label>No Handphone</label>
            <input type="text" class="form-control" id="no_hp">
          </div>
          <div class="col-md-6">
            <label>Jenis Kelamin</label>
            <select class="form-select" id="jenis_kelamin">
              <option value="">Pilih</option>
              <option value="Laki-laki">Laki-laki</option>
              <option value="Perempuan">Perempuan</option>
            </select>
          </div>
          <div class="col-md-6">
            <label>Tempat Lahir</label>
            <input type="text" class="form-control" id="tempat_lahir">
          </div>
          <div class="col-md-6">
            <label>Tanggal Lahir</label>
            <input type="date" class="form-control" id="tanggal_lahir">
          </div>
          <div class="col-md-6">
            <label>Alamat</label>
            <input type="text" class="form-control" id="alamat">
          </div>
          <div class="col-md-6">
            <label>Semester</label>
            <input type="number" class="form-control" id="semester" min="1">
          </div>
          <div class="col-md-6">
            <label>Angkatan</label>
            <input type="number" class="form-control" id="angkatan">
          </div>
          <div class="col-md-6">
            <label>Fakultas</label>
            <select class="form-select" id="fakultas_id"></select>
          </div>
          <div class="col-md-6">
            <label>Program Studi</label>
            <select class="form-select" id="jurusan_id"></select>
          </div>
        </div>

        <div class="action-area mt-4">
          <button type="submit" class="btn btn-primary btn-lg">
            <i class="bi bi-save"></i> Simpan Perubahan
          </button>
          <button type="reset" class="btn btn-warning btn-lg">
            <i class="bi bi-arrow-repeat"></i> Reset
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
  <div class="container">
    <p>© 2026 Sistem Informasi Mahasiswa | Dibuat dengan <strong>FastAPI</strong> & <strong>Supabase</strong></p>
  </div>
</footer>

<!-- Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Javascript -->
<script src="js/mahasiswa_edit.js"></script>
</body>
</html>
